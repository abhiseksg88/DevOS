[build]
  # Build Next.js frontend only (ignore Python backend)
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Use Node.js 20 (stable, recommended for Next.js 14)
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Environment variable mapping:
# NEXT_PUBLIC_* vars are available client-side (anon key only)
# Server-side vars (API routes) can access SUPABASE_SERVICE_ROLE_KEY
# NEVER expose service role key to client-side code
#
# Required Netlify env vars:
#   NEXT_PUBLIC_SUPABASE_URL        — Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   — Supabase anon key (safe for client)
#   ANTHROPIC_API_KEY               — For serverless /api/generate route
#   NEXT_PUBLIC_API_URL             — Backend API URL (Railway)

# Next.js adapter — handles SSR, API routes, middleware, and image optimization
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Note: No SPA fallback redirect needed — @netlify/plugin-nextjs handles
# all SSR, ISR, and client-side routing automatically.
