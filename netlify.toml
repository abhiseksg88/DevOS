[build]
  # Build Next.js frontend only (ignore Python backend)
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Use Node.js 20 (stable, recommended for Next.js 14)
  NODE_VERSION = "20"
  # Do NOT install Python packages
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js plugin handles all routing automatically — no custom redirects needed.
# IMPORTANT: Do NOT add a [[redirects]] from="/*" rule — it breaks Next.js
# SSR, API routes, middleware, and auth callbacks.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Disable Netlify Functions (we use Railway for backend)
  directory = "none"
