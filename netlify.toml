[build]
  # Build Next.js frontend only (ignore Python backend)
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Use Node.js 20 (stable, recommended for Next.js 14)
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js plugin handles all routing automatically.
# IMPORTANT: Do NOT add a [[redirects]] from="/*" rule — it breaks Next.js
# SSR, API routes, middleware, and auth callbacks.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Required environment variables (set in Netlify UI → Site settings → Environment variables):
#   ANTHROPIC_API_KEY          — Required for AI code generation
#   NEXT_PUBLIC_SUPABASE_URL   — Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — Supabase anonymous key
#   NEXT_PUBLIC_API_URL        — Backend API URL (e.g. https://your-backend.railway.app)
# ---------------------------------------------------------------------------
